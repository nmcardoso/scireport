# modern@1 "Publication": the look of a journal-style report (the TUPAN publication plan): a steel-blue
# cover band with a gold stripe, Palatino-like text, blue Helvetica-like headings, booktabs tables and
# boxes with a coloured title bar. Every state carries a printed word as well as a colour. Frozen (ADR-0008).
spec: ">=1.0,<2.0"
name: modern
version: 1
title: Modern (Publication)
description: A journal-style report. Steel-blue cover band with a gold stripe, numbered blue headings, justified Palatino-like text, booktabs tables and boxes with a coloured title bar. TeX Gyre Pagella, Heros and Cursor.
formats:
  md:
    document: md/document.md.j2
    components: md/components.md.j2
  html:
    document: html/document.html.j2
    components: html/components.html.j2
    css: [html/tokens.css, html/base.css, html/components.css, html/print.css, html/screen.css, html/modern.css]
  tex:
    document: latex/document.tex.j2
    components: latex/components.tex.j2
    style: latex/scireport-modern.sty
options:
  - name: toc
    type: bool
    default: true
    description: Write a table of contents.
  - name: cover
    type: bool
    default: true
    description: Start with the cover page (otherwise a plain title block).
  - name: paper
    type: str
    default: a4
    choices: [a4, letter]
    description: Paper size of the PDF and of the LaTeX project.
  - name: chapter_breaks
    type: bool
    default: false
    description: Start every chapter on a new page (by default chapters follow each other).
  - name: numbered_captions
    type: bool
    default: true
    description: Prefix captions with "Table N." and "Figure N.".
  - name: header
    type: bool
    default: true
    description: Print the running header and footer on the pages of a PDF.
pdf_engines: [weasyprint, latex]
mplstyle: modern
palette: palette.yaml
fonts:
  - TeXGyrePagella-Regular.otf
  - TeXGyrePagella-Italic.otf
  - TeXGyrePagella-Bold.otf
  - TeXGyrePagella-BoldItalic.otf
  - TeXGyreHeros-Regular.otf
  - TeXGyreHeros-Italic.otf
  - TeXGyreHeros-Bold.otf
  - TeXGyreCursor-Regular.otf
