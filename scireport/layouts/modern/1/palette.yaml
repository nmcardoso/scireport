# The single source of truth of the look of modern@1 ("Signal"; ADR-0007). Hand-written: tokens.css, the .sty
# file and styles/modern.mplstyle repeat these hex values, and tests/unit/styles/test_consistency.py parses all
# four and fails when one drifts. Black, white and one vermilion; --data-* colours are for chart series only.
name: modern
colors:
  ink: "#0a0a0a"
  ink-soft: "#3a3a3a"
  navy: "#0a0a0a"
  navy-deep: "#0a0a0a"
  blue: "#0a0a0a"
  blue-light: "#ebebeb"
  cyan: "#3a3a3a"
  cyan-light: "#ebebeb"
  accent: "#f04e23"
  accent-light: "#fde8e0"
  accent-ink: "#b3340f"
  green: "#0a0a0a"
  green-light: "#f0f0f0"
  red: "#b3340f"
  red-light: "#fbd9cd"
  paper: "#ffffff"
  paper-warm: "#f4f4f2"
  gray-50: "#f5f5f5"
  gray-100: "#ebebeb"
  gray-200: "#d9d9d9"
  gray-300: "#b5b5b5"
  gray-500: "#5c5c5c"
  gray-700: "#333333"
  data-blue: "#0072b2"
  data-green: "#009e73"
  data-purple: "#cc79a7"
  data-sky: "#56b4e9"
# Colours with a fixed meaning in a chart: the accent means "needs attention".
role:
  failed: red
  flagged: accent-ink
  success: ink
  warning: accent
  neutral: gray-500
  annotation: ink
status:
  success: ink
  warning: accent
  partial: accent
  failed: accent-ink
  running: ink
# Series colours, in order.
cycle: [data-blue, accent, data-green, data-purple, ink, gray-500]
cmap:
  sequential: cividis
  diverging: RdBu_r
fonts:
  sans: [Inter, Source Sans 3, Helvetica Neue, Arial, sans-serif]
  mono: [IBM Plex Mono, Inter, JetBrains Mono, DejaVu Sans Mono, monospace]
spacing: [4, 8, 12, 16, 24, 32, 48, 64]
type_scale:
  title: 48.0
  section: 21.0
  subsection: 12.5
  body: 10.0
  metadata: 8.5
  table: 8.0
body_line_height: 1.5
heading_line_height: 1.1
page:
  width_mm: 210.0
  height_mm: 297.0
  margin_x_mm: 16.0
  margin_y_mm: 24.0
