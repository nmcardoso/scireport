# The single source of truth of the look of modern@1 ("Publication"; ADR-0007). Hand-written: tokens.css, the .sty
# file and styles/modern.mplstyle repeat these hex values, and tests/unit/styles/test_consistency.py parses all
# four and fails when one drifts. The look follows the TUPAN publication-plan report: a steel-blue and gold
# palette, TeX Gyre Pagella text, TeX Gyre Heros headings, TeX Gyre Cursor for code. The --data-* colours are
# for chart series only.
name: modern
colors:
  ink: "#111111"
  ink-soft: "#444b52"
  navy: "#1f4e79"
  navy-deep: "#163a5a"
  blue: "#1f4e79"
  blue-light: "#e8eff6"
  cyan: "#00897b"
  cyan-light: "#dff1ef"
  accent: "#c8961e"
  accent-light: "#faf3e3"
  accent-ink: "#8d6a12"
  green: "#2e8b57"
  green-light: "#e4f2ea"
  red: "#c0392b"
  red-light: "#f8e4e1"
  paper: "#ffffff"
  paper-warm: "#f4f6f8"
  gray-50: "#f4f6f8"
  gray-100: "#e9edf0"
  gray-200: "#d5dbe0"
  gray-300: "#b7c0c8"
  gray-500: "#6b7782"
  gray-700: "#444f58"
  data-blue: "#1f77b4"
  data-green: "#2e8b57"
  data-purple: "#6a3d9a"
  data-orange: "#d35400"
# Colours with a fixed meaning in a chart: red means "failed", gold "needs attention".
role:
  failed: red
  flagged: accent-ink
  success: green
  warning: accent
  neutral: gray-500
  annotation: navy
status:
  success: green
  warning: accent
  partial: accent
  failed: red
  running: cyan
# Series colours, in order.
cycle: [navy, accent, cyan, data-orange, data-purple, gray-500]
cmap:
  sequential: cividis
  diverging: RdBu_r
fonts:
  sans: [TeXGyreHerosSubset, TeXGyreHeros, TeX Gyre Heros, Helvetica Neue, Arial, sans-serif]
  mono: [TeXGyreCursorSubset, TeXGyreCursor, TeX Gyre Cursor, Courier New, Courier, monospace]
  serif: [TeX Gyre Pagella Subset, TeX Gyre Pagella, Palatino Linotype, Palatino, Georgia, serif]
spacing: [4, 8, 12, 16, 24, 32, 48, 64]
type_scale:
  title: 22.0
  section: 17.3
  subsection: 14.4
  body: 11.0
  metadata: 9.0
  table: 8.5
body_line_height: 1.32
heading_line_height: 1.2
page:
  width_mm: 210.0
  height_mm: 297.0
  margin_x_mm: 22.0
  margin_y_mm: 25.0
